name: Feature request
description: Propose a focused improvement to the private action workflow.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the task the user cannot complete well today.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed behavior
      description: Explain the change, user controls and expected outcome.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and resource impact
      description: Does this require networking, permissions, retained content or additional model resources?
