name: Core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests and repository checks
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check repository structure and links
        run: python3 Scripts/check_repository.py
      - name: Check privacy and action boundaries
        run: python3 Scripts/check_boundaries.py
      - name: Build Swift core
        run: swift build --package-path Core
      - name: Run deterministic security scenarios
        run: swift run --package-path Core SecurityChecks
      - name: Run core XCTest suite
        run: swift test --package-path Core
